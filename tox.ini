[tox]
minversion = 4.56.2
envlist = py313, flake8, mypy
isolated_build = true

[gh-actions]
python =
    3.13: py313, mypy, flake8

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:flake8]
basepython = python3.13
deps = flake8==7.3.0
commands = flake8 src tests

[testenv:mypy]
basepython = python3.13
deps =
    -r{toxinidir}/requirements_dev.txt
commands = mypy src
