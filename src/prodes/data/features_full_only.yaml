    r_squared_with_first_partner: 0.9978
  NSurfPosEpAverage:
    plot_name: '# positive-EP surface points (average)'
    short_explanation: Number of surface points with positive EP, average charges.
    long_explanation: Count of surface points with EP > 0 under the partial-charge model. Size of positive patches.
    unit: v
    original_explanation: Number of points with a positive electrostatic potential calculated using charges ranging between 1 and -1
