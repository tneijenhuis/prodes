[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prodes"
version = "6.0.0"
description = "A package to calculate protein surface descriptors"
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Tim Neijenhuis", email = "t.neijenhuis@tudelft.nl"},
    {name = "Mark Teese"},
]
requires-python = ">=3.13"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "threadpoolctl==3.6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/datacatalysis/prodes"
Repository = "https://github.com/datacatalysis/prodes"
"Original repository" = "https://github.com/Tneijenhuis/prodes"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.15.22",
    "mypy==2.1.0",
    "pandas-stubs==3.0.5.260730",
    "pre-commit==4.6.1",
    "sphinx==8.2.3",
    "tox==4.56.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prodes = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 160
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B905: zip() without strict=. The reassembly loops that write worker results back
# onto the parent's objects rely on the lengths matching, and a silent truncation
# there produces wrong feature values rather than an error.
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
allow_untyped_globals = true
